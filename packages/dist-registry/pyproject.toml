[project]
name = "dist-registry"
version = "0.1.0"
description = "Operational store shared by the admin plane and the ingest worker: source registry, job queue, audit log"
requires-python = ">=3.13"
dependencies = [
    "dist-core",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_registry"]

[tool.uv.sources]
dist-core = { workspace = true }
