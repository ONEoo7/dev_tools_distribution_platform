[project]
name = "dist-core"
version = "0.1.0"
description = "TUF metadata operations, signer abstraction and publication policy"
requires-python = ">=3.13"
dependencies = [
    "tuf>=7.0.0,<8",
    "securesystemslib[crypto]>=1.2",
    "pykeepass>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_core"]
