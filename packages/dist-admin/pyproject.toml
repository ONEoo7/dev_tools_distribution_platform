[project]
name = "dist-admin"
version = "0.1.0"
description = "Admin plane: operator web UI for the forge source registry"
requires-python = ">=3.13"
dependencies = [
    "dist-core",
    "dist-registry",
    # Only to parse a pasted builder public key at form time, so that a key
    # that cannot load is rejected in the form rather than at every release.
    "cryptography>=44",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_admin"]

[tool.uv.sources]
dist-core = { workspace = true }
dist-registry = { workspace = true }
