[project]
name = "dist-ingest"
version = "0.1.0"
description = "Forge release ingestion: quarantine, provenance gates and promotion policy"
requires-python = ">=3.13"
dependencies = [
    "dist-core",
    # The worker's queue and source registry. The security core below does not
    # touch it: `provenance`, `attestation`, `gates` and `policy` know nothing
    # about a database, and `sources.py` is the only bridge.
    "dist-registry",
    "cryptography>=44",
    "httpx>=0.28",
    # Fulcio chain validation, SCTs, Rekor inclusion proofs and checkpoint
    # signatures. Deliberately not hand-rolled: see PLAN.md 4.1 and the
    # docstring in attestation.py.
    "sigstore>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_ingest"]

[tool.uv.sources]
dist-core = { workspace = true }
dist-registry = { workspace = true }
