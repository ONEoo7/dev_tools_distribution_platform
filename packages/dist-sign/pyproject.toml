[project]
name = "dist-sign"
version = "0.1.0"
description = "The signing worker: publishes approved artifacts into the TUF repository"
requires-python = ">=3.13"
# No HTTP client and no forge library, deliberately. This service reads from
# quarantine and writes signed metadata; it has no business reaching a network
# and nothing here should make that easy to add by accident.
dependencies = [
    "dist-core",
    "dist-registry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_sign"]
