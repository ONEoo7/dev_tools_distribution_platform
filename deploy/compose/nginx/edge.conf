# Static read-only edge (PLAN.md section 4).
#
# This is the only publicly reachable component. It serves files and nothing
# else: there is no code path here that can alter metadata, and the repository
# volumes are mounted read-only so the property is enforced by the mount rather
# than by this configuration being correct.

server {
    listen 8080;
    server_name _;

    root /srv/repo;
    autoindex off;
    server_tokens off;

    # The repository is bytes on disk; nothing needs a request body.
    client_max_body_size 1k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # timestamp.json is the freshness signal for every client. Caching it
    # defeats the short expiry in PLAN.md 3.1 and is indistinguishable from a
    # freeze attack, so it must never be held by an intermediary.
    location = /metadata/timestamp.json {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The unversioned root alias changes on every root rotation, and clients
    # use it to bootstrap. A stale copy pins them to a superseded trust root.
    location = /metadata/root.json {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Everything else under metadata/ is version-numbered and therefore
    # immutable once published.
    location /metadata/ {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Payloads are content-addressed, so a given URL can only ever hold one
    # byte sequence.
    location /targets/ {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/octet-stream;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
