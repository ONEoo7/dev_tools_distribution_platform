stages: [lint, test]

variables:
  UV_LINK_MODE: copy
  ENV: ci
  CARGO_TERM_COLOR: always

.python:
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir uv==0.11.23
    - uv sync --all-packages --locked

.rust:
  image: rust:1.97-slim
  before_script:
    - rustup component add clippy rustfmt
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [client/target, .cargo]

python-lint:
  extends: .python
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy packages

python-test:
  extends: .python
  stage: test
  script:
    - uv run pytest --cov=dist_core --cov-report=term-missing

rust-lint:
  extends: .rust
  stage: lint
  script:
    - cd client
    - cargo fmt --check
    # Lints in client/Cargo.toml deny unwrap, expect, panic and indexing in the
    # verifier. A panic there is a denial of service on the update path.
    - cargo clippy --all-targets -- -D warnings

rust-test:
  extends: .rust
  stage: test
  script:
    - cd client
    # Includes the metadata mutation harness (D1 fuzzing mitigation).
    - cargo test --all-features

# D1 mitigation: measure spec conformance rather than assume it. We ship a
# forked verifier, so this is the only independent check on those patches.
#
# allow_failure while 43 of 112 still fail (delegation traversal, role-name
# quoting, rollback checks). Patches 5 and 6 took this from 22 to 69 passing;
# the remainder are not yet triaged. See docs/PLAN.md 11.2.
#
# NOTE: this clones from github.com. Egress policy (§4.1) allows the self-hosted
# GitLab only, so before enabling, mirror tuf-conformance into GitLab and point
# CONFORMANCE_REPO at it.
conformance:
  extends: .rust
  stage: test
  allow_failure: true
  variables:
    CONFORMANCE_REPO: "https://github.com/theupdateframework/tuf-conformance.git"
  script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv git
    - cd client && cargo build -p dist-conformance && cd ..
    - git clone --depth 1 "$CONFORMANCE_REPO" /tmp/tuf-conformance
    - cd /tmp/tuf-conformance
    - python3 -m venv env && ./env/bin/pip install -q -e .
    - ./env/bin/pytest tuf_conformance -q
      --entrypoint "$CI_PROJECT_DIR/client/target/debug/dist-conformance"
